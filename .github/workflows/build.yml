name: Build Globed (2.209)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'docs/*.md'
      - 'previews/**'
      - 'README.md'
      - 'rescale.py'

  # pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          # TEMPORARY: other platforms disabled while diagnosing 2.2091's "gd"
          # namespace issue. Restore before merging.
          # - name: Windows
          #   os: windows-latest
          #   build-config: RelWithDebInfo

          # - name: macOS
          #   os: macos-latest

          # - name: iOS
          #   os: macos-latest
          #   target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          # - name: Android64
          #   os: ubuntu-latest
          #   target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The build-geode-mod action already caches CPM sources and compiler
      # output (sccache), but neither covers the CMake/Ninja build directory
      # itself (incremental configure state + linking). Caching it too lets
      # unrelated-file pushes relink/reconfigure instead of starting cold.
      - name: Restore build directory cache
        uses: actions/cache@v6
        with:
          path: build
          # Keyed on CMakeLists.txt/mod.json.template/geobuild.py so that changing SDK
          # version, GD version, or dependency pins (all resolved into CACHE INTERNAL
          # CMake variables that silently stick once set) invalidates the cache instead
          # of restoring a build/ directory configured for a different target - that
          # caused a real GD-version mismatch failure in practice. Deliberately no
          # broader restore-keys fallback.
          key: build-${{ matrix.config.name }}-${{ hashFiles('CMakeLists.txt', 'mod.json.template', 'geobuild.py', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.config.name }}-${{ hashFiles('CMakeLists.txt', 'mod.json.template', 'geobuild.py', 'cmake/**') }}-

      - name: Build the mod
        id: build_the_mod
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        env:
          GLOBED_SENTRY_URL: ${{ vars.GLOBED_SENTRY_URL }}
          GLOBED_SENTRY_KEY: ${{ vars.GLOBED_SENTRY_KEY }}
        with:
          # 'latest' (the newest tagged Geode release, v5.11.2) still defaults to
          # targeting GD 2.2081. The default moved to GD 2.2091 on Geode's main
          # branch but hasn't been tagged in a release yet, so build against
          # 'nightly' to actually target 2.2091.
          sdk: 'nightly'
          build-config: ${{ matrix.config.build-config || 'Release' }}
          configure-args: '-DGLOBED_RELEASE=ON'
          export-pdb: true
          export-symbols: true
          combine: true
          target: ${{ matrix.config.target }}
          # sccache is broken on macos, so use no cache there :(
          ccache-variant: ${{ matrix.config.os != 'macos-latest' && 'sccache' || '' }}

      # TEMPORARY thorough diagnostic for the "gd" namespace issue.
      - name: Debug - locate namespace gd thoroughly
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== cat GeneratedBinding.hpp (first 100 lines) ==="
          head -100 build/bindings/bindings/Geode/GeneratedBinding.hpp
          echo "=== grep GeneratedBinding.hpp for gd ==="
          grep -n "gd" build/bindings/bindings/Geode/GeneratedBinding.hpp
          echo "=== full generated binding/ header count ==="
          find build/bindings -iname "*.hpp" | wc -l
          echo "=== searching ENTIRE workspace for 'namespace gd' ==="
          grep -rn "namespace gd" / --include="*.hpp" --include="*.h" --include="*.cpp" 2>/dev/null
          echo "(search done)"
          echo "=== searching for 'gd::string' usage in build/bindings ==="
          grep -rln "gd::string" build/bindings
          echo "=== check if GeneratedSource.cpp defines gd namespace ==="
          find build -iname "GeneratedSource.cpp" -exec grep -l "namespace gd" {} \;
          find build -iname "GeneratedSource.cpp" -exec wc -l {} \;
          echo "=== geode-sdk-clone version info ==="
          cat geode-sdk-clone/VERSION
          echo "=== bindings-src commit ==="
          cd build/_deps/bindings-src && git rev-parse HEAD && git log -1 --format=%cd
          echo "=== DONE ==="

      - name: Fail job if build actually failed
        if: steps.build_the_mod.outcome == 'failure'
        run: exit 1

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build
    permissions: write-all

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        with:
          zstd: true
          optimize-pngs: true
        id: build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: globed-build-output
          path: ${{ steps.build.outputs.build-output }}

      - name: Get latest release tag
        id: getrelease
        run: echo "tag=$(curl -s https://api.github.com/repos/${{ github.event.repository.full_name }}/releases/latest | jq -r .tag_name)" >> $GITHUB_OUTPUT

      - name: Create nightly release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'Development Release'
          body: |
            This is a nightly build of Globed for commit ${{ github.sha }} (${{ github.event.head_commit.message }}).

            > **Note:** this build might not be stable and may contain issues, use at your own risk!

            Changes since the last release: ${{ github.event.repository.html_url }}/compare/${{ steps.getrelease.outputs.tag }}...nightly
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/*.pdb
